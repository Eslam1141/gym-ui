<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Etqadem</title>
<link rel="icon" type="image/svg+xml" href="icons/logo-etq.svg">
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="net-blocked">
<!-- The service worker serves this for a page load when the network is down AND the app
     shell is not in the cache (storage cleared or evicted). With the shell cached the
     app opens normally and net.js shows its own banner or screen. -->
<main class="net-screen" aria-labelledby="netScreenTitle">
  <div class="net-screen-inner">
    <svg class="net-art" viewBox="0 0 160 120" width="160" height="120" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-dasharray="4 5" opacity=".55"><rect x="62" y="68" width="32" height="40" rx="7"/><rect x="104" y="48" width="32" height="60" rx="7"/></g><rect class="net-art-on" x="20" y="88" width="32" height="20" rx="7"/><circle class="net-art-head" cx="36" cy="68" r="10"/></svg>
    <h1 id="netScreenTitle" class="net-screen-title">You're offline</h1>
    <p class="net-screen-body" id="netBody">Etqadem couldn't load. Check your Wi-Fi or mobile data, then try again. We'll reconnect on our own when you're back online.</p>
    <button type="button" class="net-screen-btn" id="netRetry">Try again</button>
    <p class="net-screen-msg" id="netMsg" role="status" aria-live="polite"></p>
  </div>
</main>
<script src="offline.js"></script>
</body>
</html>
