# Site-wide security headers. Included at server level AND inside every
# location that sets its own add_header: nginx drops inherited add_header
# directives in any block that declares one, so each such location must
# include this file again.
# connect-src must include the gym-be / gym-assistant API origin (progress
# sync + the AI Coach call are cross-origin). The app ships no external
# media, so media-src is 'self' only. The landing page needs only 'self'.
# The app's index.html used to be served WITHOUT this header (its location
# block only set Cache-Control), so two things it relies on were never
# checked: the early-paint inline <script> (allowed by its sha256; update the
# hash if that script changes) and html2canvas from cdnjs (SRI-pinned in the
# tag, path-pinned so no other cdnjs library can load). GSI's renderButton
# injects https://accounts.google.com/gsi/style. All are allowed here so serving the CSP on the app doesn't break it.
add_header X-Content-Type-Options "nosniff" always;
# Google Identity Services checks the page origin from the Referer: with
# "no-referrer" the sign-in button and One Tap fail with "The given origin is
# not allowed for the given client ID". strict-origin-when-cross-origin sends
# only the origin cross-site, never the path or query (reset tokens stay put).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-xU0+t2MQ0irdz961BRaRCjFE8POXGI5KNrlge20+e2o=' https://accounts.google.com/gsi/client https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://gym-be.cloider.app; img-src 'self' data: https:; media-src 'self'; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
# Nothing in the app uses these browser features.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
