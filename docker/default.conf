# Layout inside the image (see Dockerfile):
#   /            landing page (repo: landing/)
#   /app/        the PWA (repo root files)
# Security headers live in /etc/nginx/snippets/security-headers.conf and are
# re-included in every location that sets its own add_header (nginx drops
# inherited add_header directives there).
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    # Relative Location headers: behind the ingress the container's own
    # http://host:8080 would otherwise leak into every redirect.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------- landing (site root) ----------------

    # gym-be's password-reset email links to /?reset_token=...; hand it to
    # the app before the landing renders.
    location = / {
        if ($arg_reset_token) {
            return 302 /app/$is_args$args;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Public account-deletion page (Google Play requires a web URL). Needs no
    # sign-in; the landing page itself is not touched.
    location = /delete-account {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /delete-account.html =404;
    }

    # Retire worker: replaces the old app service worker registered at scope
    # "/" (it unregisters itself), so the landing is never served by it.
    location = /service-worker.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Old URLs from before the app moved to /app/. Installed PWAs launch
    # their old start_url /index.html; keep the query (reset tokens).
    location = /index.html      { return 301 /app/$is_args$args; }
    location = /manifest.json   { return 301 /app/manifest.json; }
    location = /admin.html      { return 301 /app/admin.html; }
    location = /reset-password  { return 302 /app/reset-password$is_args$args; }

    # Landing code: revalidate so it never drifts from the no-cache index.html.
    location ~ ^/(landing\.css|landing\.js|boot\.js|delete-account\.(css|js))$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Landing images and fonts: new filename on change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------------- app (/app/) ----------------

    location = /app { return 301 /app/; }

    # Never cache the entrypoints
    location = /app/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /app/service-worker.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /app/manifest.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # config.js is generated at container start under /tmp so the root
    # filesystem can stay read-only.
    location = /app/config.js {
        alias /tmp/gym-config/config.js;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }

    # SPA fallback for the password-reset link (auth-email.js accepts
    # .../reset-password?token=... as well as ?reset_token=...). There is no
    # reset-password file, so without this a direct hit 404s.
    location = /app/reset-password {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /app/index.html =404;
    }

    # Admin dashboard: never cached (dynamic per-admin data) and excluded
    # from search indexing.
    location ~ ^/app/admin\.(html|js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    # Fingerprint-safe static assets (icons get new filenames on change).
    location ~ ^/(app/)?icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
