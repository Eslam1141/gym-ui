name: gym-ui image
on:
  push:
    branches: [main]
    # Build on any change except files that never reach the image. (An
    # allow-list of paths kept going stale: header.js/profile.js/admin.* etc.
    # were missing, so merges touching only those never deployed.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "graphify-out/**"
      - "tools/**"
      - "screenshots/**"
  # Manual redeploy from the Actions tab.
  workflow_dispatch:
  pull_request:

# Cancel superseded PR runs only; never cancel a main run (deploy has its own group).
concurrency:
  group: ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compute tree SHA
        id: tree-sha
        run: |
          TREE_SHA=$(git rev-parse HEAD^{tree})
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Login to ghcr.io (for cache check)
        id: ghcr-login-cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether this tree's image is already cached
        id: cache-check
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          TREE_SHA="${{ steps.tree-sha.outputs.tree_sha }}"
          if docker buildx imagetools inspect "ghcr.io/eslam1141/gym-ui:tree-$TREE_SHA" > /dev/null 2>&1; then
            echo "exists=0" >> "$GITHUB_OUTPUT"
          else
            echo "exists=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: github.event_name == 'pull_request' || steps.cache-check.outputs.exists != '0'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: gym-ui:ci
          # GitHub Actions layer cache (mode=max keeps intermediate stages); the smoke Build
          # and the main-branch Push share it, so Push is a near no-op after Build.
          cache-from: type=gha,scope=gym-ui
          cache-to: type=gha,mode=max,scope=gym-ui
      - name: Smoke
        if: github.event_name == 'pull_request' || steps.cache-check.outputs.exists != '0'
        run: |
          docker run -d --rm -p 8080:8080 -e GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com --name ui gym-ui:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz | grep -q ok
          curl -fsS localhost:8080/app/config.js | grep -q ci.apps.googleusercontent.com
          # landing at /, app at /app/, old app URLs redirect (docker/default.conf)
          curl -fsS localhost:8080/ | grep -q 'landing.css'
          curl -fsS localhost:8080/app/ | grep -q 'id="onboarding"'
          curl -fsS localhost:8080/app/service-worker.js | grep -Eq 'etqadem-[0-9a-f]{12}'
          curl -fsS localhost:8080/app/dom.js | grep -q 'window.GymDom'
          curl -fsS localhost:8080/service-worker.js | grep -q 'unregister'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/index.html)" = "301"
          curl -sI localhost:8080/index.html | tr -d '\r' | grep -qi '^location: /app/$'
          curl -sI 'localhost:8080/?reset_token=abc' | tr -d '\r' | grep -qi '^location: /app/?reset_token=abc$'
          curl -fsSI localhost:8080/ | grep -qi 'content-security-policy'
          curl -fsSI localhost:8080/app/ | grep -qi 'content-security-policy'
          # Google sign-in breaks under Referrer-Policy: no-referrer
          curl -fsSI localhost:8080/app/ | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/missing)" = "404"
          docker rm -f ui
      - name: Smoke (read-only rootfs)
        if: github.event_name == 'pull_request' || steps.cache-check.outputs.exists != '0'
        run: |
          docker run -d --rm -p 8090:8080 --read-only \
            --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /var/run \
            -e GOOGLE_CLIENT_ID=ro.apps.googleusercontent.com --name uiro gym-ui:ci
          for i in $(seq 1 20); do curl -fsS localhost:8090/healthz && break; sleep 1; done
          curl -fsS localhost:8090/app/config.js | grep -q ro.apps.googleusercontent.com
          docker rm -f uiro
      - name: Push tree-tagged image (cache for later promotion)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.cache-check.outputs.exists != '0'
        run: |
          TREE_SHA="${{ steps.tree-sha.outputs.tree_sha }}"
          docker tag gym-ui:ci "ghcr.io/eslam1141/gym-ui:tree-$TREE_SHA"
          docker push "ghcr.io/eslam1141/gym-ui:tree-$TREE_SHA"
      - uses: docker/login-action@v4.6.0
        if: github.ref == 'refs/heads/main' && steps.cache-check.outputs.exists != '0'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main' && steps.cache-check.outputs.exists != '0'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eslam1141/gym-ui:${{ github.sha }}
            ghcr.io/eslam1141/gym-ui:latest
          # GitHub Actions layer cache (mode=max keeps intermediate stages); the smoke Build
          # and the main-branch Push share it, so Push is a near no-op after Build.
          cache-from: type=gha,scope=gym-ui
          cache-to: type=gha,mode=max,scope=gym-ui
      - name: Promote cached tree image to release tags
        if: github.ref == 'refs/heads/main' && steps.cache-check.outputs.exists == '0'
        run: |
          TREE_SHA="${{ steps.tree-sha.outputs.tree_sha }}"
          docker buildx imagetools create \
            --tag "ghcr.io/eslam1141/gym-ui:${{ github.sha }}" \
            --tag ghcr.io/eslam1141/gym-ui:latest \
            "ghcr.io/eslam1141/gym-ui:tree-$TREE_SHA"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    # Serializes gym-ui deploys only: concurrency groups are scoped to one repository, so this does NOT
    # block gym-be's deploy job. Cross-repo safety is in gym-be's deploy/scripts/helm-deploy.sh
    # (fresh values from origin/main before each attempt + drift guard).
    concurrency:
      group: deploy-gym
      cancel-in-progress: false
    environment: production
    steps:
      - name: check deploy token
        env:
          GYM_BE_DEPLOY_TOKEN: ${{ secrets.GYM_BE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GYM_BE_DEPLOY_TOKEN" ]; then
            echo "::error::secret GYM_BE_DEPLOY_TOKEN is not set. Add a fine-grained PAT (repo Eslam1141/gym-be, Contents: Read and write) to the 'production' environment secrets of this repo; see README-deploy.md."
            exit 1
          fi
      # The build job always leaves ghcr.io/eslam1141/gym-ui:<sha> in place on main
      # (fresh push, or promotion of the cached tree image), and deploy needs build.
      - uses: actions/checkout@v7.0.1
        with:
          path: ui
          fetch-depth: 0
      - uses: actions/checkout@v7.0.1
        with:
          repository: Eslam1141/gym-be
          ref: main
          path: gym-be
          token: ${{ secrets.GYM_BE_DEPLOY_TOKEN }}
      - uses: azure/setup-helm@v5.0.1
        with: { version: v4.2.2 }
      - uses: azure/setup-kubectl@v5.1.0
      - name: kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      - name: skip if a newer gym-ui commit is already pinned
        id: stale
        run: |
          git -C gym-be fetch -q origin main
          cur=$(git -C gym-be show origin/main:deploy/helm/gym-platform/values-cluster.yaml | grep -A2 '^gymUi:' | grep -oE '[0-9a-f]{40}' | head -1)
          if [ -n "$cur" ] && [ "$cur" != "$GITHUB_SHA" ] && git -C ui merge-base --is-ancestor "$GITHUB_SHA" "$cur" 2>/dev/null; then
            echo "values already at newer gym-ui commit $cur; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: bump gymUi.image.tag in gym-be values-cluster.yaml and push
        if: steps.stale.outputs.skip != 'true'
        working-directory: gym-be
        run: bash deploy/scripts/commit-image-tag.sh gymUi "$GITHUB_SHA" main
      - name: helm upgrade gym
        if: steps.stale.outputs.skip != 'true'
        working-directory: gym-be
        env:
          DEPLOYING: gym-ui
        run: bash deploy/scripts/helm-deploy.sh
      - name: verify rollout
        if: steps.stale.outputs.skip != 'true'
        run: |
          kubectl -n gym rollout status deploy/gym-gym-ui --timeout=120s
          img=$(kubectl -n gym get deploy/gym-gym-ui -o jsonpath='{.spec.template.spec.containers[0].image}')
          [ "$img" = "ghcr.io/eslam1141/gym-ui:$GITHUB_SHA" ] || { echo "::error::live image is $img, expected this commit"; exit 1; }
